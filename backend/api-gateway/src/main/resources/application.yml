
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: book-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/books/**

            - id: library-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/library/**

            - id: smart-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/smart/**

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
